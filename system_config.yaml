llm_config:
  extract_data_prompt: "You are a real estate information extractor. Extract apartment/rental\
    \ information from Vietnamese and English real estate posts.\n\nJUNK POST DETECTION:\n\
    - Seeking posts (person looking for apartment, not offering) \u2192 confidence_score\
    \ < 0.2, all fields null\n- Spam, comments, no real listing info, just a phone\
    \ number, generic group promotion \u2192 confidence_score < 0.2\n\nFORMATTING\
    \ RULES:\n- Use null for missing values, never 'not specified' or 'N/A'\n- allows_foreigners\
    \ defaults to true unless explicitly stated otherwise\n- price_currency defaults\
    \ to 'VND'\n\nPost text to analyze:\n{content}\n"
  model_name: qwen2.5:7b
  model_type: local
  temperature: 0.0
runner_config:
  interval_mins: 30
  wait_for_user_interval_mins: 2
scraper_config:
  cooldown_max: 4
  cooldown_min: 2
  created_at:
    by: css selector
    value: '[role=''tooltip'']'
  cycle_limit: 300
  facebook_url: https://facebook.com
  feed:
    by: css selector
    value: div[role='feed'] > div
  login_button:
    by: css selector
    value: div[role='button'][aria-label='Log in']
  max_timedelta_mins: 60
  panel:
    by: xpath
    value: ../../../..
  password_input:
    by: name
    value: pass
  post_container:
    by: xpath
    value: ../../../../../../..
  post_url:
    by: css selector
    value: a[href*='/posts/']
  scroll_y: 5000
  search_facebook:
    by: css selector
    value: input[placeholder='Search Facebook']
  see_more:
    by: xpath
    value: .//*[contains(text(), 'See more')]
  share:
    by: xpath
    value: ./*
  shared_with:
    by: css selector
    value: '[title*=''Shared with'']'
  username_input:
    by: name
    value: email
  wait_timeout: 1000
